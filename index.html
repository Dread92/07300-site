<style>
/* Layout: the flag itself — blue, the grey band carrying the mark, yellow — one screen, the words on the band. */
:root{--blue:#0057b8;--yellow:#fcfe38;--grey:#c0c0c0;--ink:#1f0276;--ink-blue:#ffffff;--ink-yellow:#1f0276;--line:#9a9a9a;
      --display:"Archivo Black","Arial Black",Arial,sans-serif;--sans:Archivo,"Segoe UI",system-ui,sans-serif}
html,body{height:100%}
body{margin:0;background:var(--blue);color:var(--ink);font:16px/1.5 var(--sans);display:flex;flex-direction:column;min-height:100%}
.band{flex:1 1 33%;display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px}
.top{background:var(--blue);color:var(--ink-blue);flex-direction:column;gap:10px;text-align:center}
.mid{background:var(--grey);flex:0 0 auto;flex-direction:column;gap:14px;padding-block:26px}
.bot{background:var(--yellow);color:var(--ink-yellow);flex-direction:column;gap:12px;text-align:center}
.mark{font:400 clamp(72px,22vw,160px)/1 var(--display);letter-spacing:.02em;color:var(--ink);font-variant-numeric:tabular-nums;margin:0}
.lang{display:flex;gap:0;border:2px solid var(--ink-blue);border-radius:2px;overflow:hidden;font:600 13px/1 var(--sans);letter-spacing:.08em}
.lang button{border:0;background:transparent;color:var(--ink-blue);padding:8px 14px;cursor:pointer;font:inherit}
.lang button[aria-pressed="true"]{background:var(--ink-blue);color:var(--blue)}
.lang button:focus-visible{outline:3px solid var(--yellow);outline-offset:-3px}
.eyebrow{font:600 13px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;margin:0;opacity:.92}
h1{font:400 clamp(22px,4.4vw,34px)/1.15 var(--display);margin:0;text-wrap:balance;max-width:22ch}
.mid p:not(.mark){margin:0;max-width:52ch;text-align:center;color:#2a2a2a;font-size:17px}
.status{display:inline-flex;align-items:center;gap:10px;font:600 14px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);border:2px solid var(--ink);border-radius:2px;padding:9px 14px}
.status i{width:10px;height:10px;border-radius:50%;background:var(--ink);display:inline-block}
@media (prefers-reduced-motion:no-preference){.status i{animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}}
.cta{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font:400 18px/1 var(--display);letter-spacing:.04em;padding:16px 26px;border-radius:2px}
.cta:hover,.cta:focus-visible{background:#2d0f99;outline:none}
.cta:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.note{font-size:14px;max-width:48ch;margin:0;opacity:.9}
.foot{font-size:13px;margin:0;opacity:.8}
</style>
</head>
<body>
<section class="band top">
  <div class="lang" role="group" aria-label="Мова / Language">
    <button type="button" data-lang="uk" aria-pressed="true">UA</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <p class="eyebrow" data-uk="Громадська організація" data-en="Non-governmental organisation">Громадська організація</p>
  <h1 data-uk="Гуманітарна допомога там, де вона потрібна" data-en="Humanitarian aid where it is needed">Гуманітарна допомога там, де вона потрібна</h1>
</section>
<section class="band mid">
  <p class="mark" aria-label="07300">07300</p>
  <span class="status"><i aria-hidden="true"></i><span data-uk="Сайт у розробці" data-en="Website in progress">Сайт у розробці</span></span>
  <p data-uk="Повна сторінка — про нас, наші проєкти та як долучитися — з’явиться тут незабаром." data-en="The full page — who we are, what we do and how to join — will appear here soon.">Повна сторінка — про нас, наші проєкти та як долучитися — з’явиться тут незабаром.</p>
</section>
<section class="band bot">
  <a class="cta" id="support" href="#" data-uk="Підтримати" data-en="Support us">Підтримати</a>
  <p class="note" data-uk="Кожен внесок іде на конкретну потребу." data-en="Every contribution goes to a concrete need.">Кожен внесок іде на конкретну потребу.</p>
  <p class="foot">© 2026 07300 · 07300.org.ua</p>
</section>
<script>
(function(){
  var SUPPORT_URL = "";   // ← the donation link goes here (left empty on purpose: nothing is invented)
  var a = document.getElementById('support'); if (SUPPORT_URL) a.href = SUPPORT_URL; else { a.setAttribute('aria-disabled', 'true'); a.style.opacity = '.55'; a.addEventListener('click', function (e) { e.preventDefault(); }); }
  function apply(l){ document.documentElement.lang = l; document.querySelectorAll('[data-uk]').forEach(function(e){ e.textContent = e.getAttribute('data-' + l) || e.textContent; });
    document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang === l)); });
    try { localStorage.setItem('lang', l); } catch (e) {} }
  var l = 'uk'; try { l = localStorage.getItem('lang') || ((navigator.language || '').slice(0, 2) === 'uk' ? 'uk' : 'en'); } catch (e) {}
  if (l !== 'uk' && l !== 'en') l = 'en';
  apply(l);
  document.querySelectorAll('.lang button').forEach(function(b){ b.addEventListener('click', function(){ apply(b.dataset.lang); }); });
})();
</script>
</body>
